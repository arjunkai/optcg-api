name = "optcg-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "optcg-cards"
database_id = "111dd49b-f7ec-472b-b23f-5b2191edb9ce"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "optcg-images"

# Keys live in D1 (api_keys, see scripts/issue-key.mjs). The optional
# API_KEYS secret is the legacy comma-separated fallback; src/auth.js now
# refuses legacy env-var keys (401), so API_KEYS can be deleted once nothing
# uses it.
# Browser callers go through the Origin allowlist in src/auth.js and don't
# need a key.

# Per-API-key per-minute limit for the standard tier (src/limits.js TIERS).
[[unsafe.bindings]]
name = "RL_MINUTE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Per-IP limit for browser (Origin) callers, counted only on edge-cache
# misses (src/edgeCache.js). Origin headers are forgeable, so this is what
# bounds a scraper that fakes one. Sized well above the heaviest real
# pattern: an OPCanvs directory scroll fires ~700 tile requests in under a
# minute from one IP, and shared NATs multiply that.
[[unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 1500, period = 60 }

# Stricter per-IP limit on the cache misses that scan whole tables (/cards
# searches without set_id, unfiltered /artwork, /artwork/gallery): each costs
# ~5-10k D1 rows, so 1500/min from one IP could spend the 5M/day read budget
# in under a minute. No first-party page issues more than a few per minute
# (OPBindr searches locally; OPCanvs only pages the gallery as you scroll).
# See isHeavyMiss in src/edgeCache.js.
[[unsafe.bindings]]
name = "RL_IP_HEAVY"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Per-tier limits for API keys (src/limits.js TIERS; tests/bindings.test.mjs).
[[unsafe.bindings]]
name = "RL_KEY_FREE"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "RL_KEY_PARTNER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 120, period = 60 }

# Heavy (table-scanning) cache misses per key, per tier. See isHeavyMiss.
[[unsafe.bindings]]
name = "RL_KEY_HEAVY_FREE"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 2, period = 60 }

[[unsafe.bindings]]
name = "RL_KEY_HEAVY"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_KEY_HEAVY_PARTNER"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 30, period = 60 }

# Unknown-key lookups per client IP (src/auth.js).
[[unsafe.bindings]]
name = "RL_KEY_LOOKUP"
type = "ratelimit"
namespace_id = "1009"
simple = { limit = 30, period = 60 }

# Usage alert cron — runs every 6 hours and posts to Discord:
# alerts at 80% of a key's tier caps and at 80% of the outside units share. See src/cron.js.
# Requires the DISCORD_USAGE_WEBHOOK_URL secret to be set; without it
# the cron is a no-op.
[triggers]
crons = ["0 */6 * * *"]
