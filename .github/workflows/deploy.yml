name: Deploy Worker

# Runs wrangler deploy whenever worker source lands on main. The scrape
# workflow already handles data imports; this one just ships code. Paths
# filter so weekly scrape commits that only touch data/ or scripts/
# don't re-deploy the worker needlessly.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Requests never build R2 snapshots (src/snapshot.js), so build them
      # from this commit's src/snapshotDefs.js before the code that serves
      # them goes live: a renamed snapshot (shape bump) would otherwise 503
      # until the next weekly import. ~100k D1 reads, no Worker requests.
      # A failed build stops the deploy.
      - name: Build R2 snapshots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPTCG_ALLOW_REMOTE: '1'
        run: node scripts/build-snapshots.mjs

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
